name: Build and deploy Backend to AKS

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  IMAGE_NAME: backend
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'microsoft'
  ENVIRONMENT: 'prod'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      image_tag: ${{ steps.extract_version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ env.IMAGE_TAG }} -DgenerateBackupPoms=false

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^appVersion:.*/appVersion: \"${{ env.IMAGE_TAG }}\"/" ./chart/Chart.yaml
          sed -i "s/^  tag:.*/  tag: \"${{ env.IMAGE_TAG }}\"/" ./chart/values-${{ env.ENVIRONMENT }}.yaml

      - name: Commit version bumps
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pom.xml ./chart/Chart.yaml ./chart/values-${{ env.ENVIRONMENT }}.yaml
          git commit -m "chore: bump version to ${{ env.IMAGE_TAG }}"
          git push origin HEAD:main

      - name: Build & Push image to ACR with Jib
        run: |
          mvn -DskipTests \
            -Dspring.profiles.active=logging \
            -Dacr.loginServer=${ACR_LOGIN_SERVER} \
            -Dimage.tag=${{ env.IMAGE_TAG }} \
            clean compile jib:build

      - name: Set next SNAPSHOT version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ env.IMAGE_TAG }}"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          mvn versions:set -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: set next development version to $NEXT_VERSION"
          git push origin HEAD:main

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy Backend
        run: |
          helm upgrade --install smym-${{ env.ENVIRONMENT }}-${{ env.IMAGE_NAME }} ./chart \
            --namespace smym-${{ env.ENVIRONMENT }} \
            --create-namespace \
            -f ./chart/values-${{ env.ENVIRONMENT }}.yaml \
            --set image.repository=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --wait
