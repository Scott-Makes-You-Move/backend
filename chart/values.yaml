# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: smymregistry.azurecr.io/backend-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

env: {}

envFrom:
  - configMapRef:
      name: backend-service-config
  - secretRef:
      name: backend-sealed-secret

service:
  type: ClusterIP
  port: 8080

resources:
   limits:
     cpu: 1000m
     memory: 1Gi
   requests:
     cpu: 250m
     memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: backend.local
