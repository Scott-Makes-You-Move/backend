# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: smymregistry.azurecr.io/backend-service
  pullPolicy: IfNotPresent
  tag: "1.0.0-SNAPSHOT"

envFrom:
  - configMapRef:
      name: backend-service-config
  - secretRef:
      name: backend-sealed-secret

service:
  type: ClusterIP
  port: 8080

resources:
   limits:
     cpu: 1000m
     memory: 1Gi
   requests:
     cpu: 250m
     memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: backend.scottmakesyoumove.com
  tls:
    - secretName: backend-scottmakesyoumove-tls
      hosts:
        - backend.scottmakesyoumove.com
