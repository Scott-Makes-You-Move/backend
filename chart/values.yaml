# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: smymregistry.azurecr.io/backend-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8080

resources:
   limits:
     cpu: 1000m
     memory: 1Gi
   requests:
     cpu: 250m
     memory: 512Mi

secrets:
  AZURE_POSTGRESQL_USERNAME: ""
  AZURE_POSTGRESQL_PASSWORD: ""
  KEYCLOAK_USERNAME: ""
  KEYCLOAK_PASSWORD: ""
  OPENAI_API_KEY: ""
