# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: smymregistry.azurecr.io/backend
  pullPolicy: IfNotPresent
  tag: "1.0.0"

envFrom:
  - configMapRef:
      name: backend-configmap
  - secretRef:
      name: backend-sealed-secrets

env:
  APP_SECURITY_ENABLED: "true"
  CHAT_CLIENT_ADVISORS_CHATMEMORY_ENABLED: "true"
  CHAT_CLIENT_ADVISORS_CHAT_MEMORY_MAX_MESSAGE: "20"
  CHAT_CLIENT_ADVISORS_CHUNKS_ENABLED: "true"
  CHAT_CLIENT_ADVISORS_CHUNKS_SIMILARITYTHRESHOLD: "0.2"
  CHAT_CLIENT_ADVISORS_CHUNKS_TOPK: "3"
  CHAT_CLIENT_ADVISORS_FILES_ENABLED: "true"
  CHAT_CLIENT_ADVISORS_FILES_SIMILARITYTHRESHOLD: "0.0"
  CHAT_CLIENT_ADVISORS_FILES_TOPK: "20"
  CHAT_CLIENT_ADVISORS_LOGGING_ENABLED: "true"
  CHAT_CLIENT_ADVISORS_MASKING_ENABLED: "false"
  CRON_DRIVE_SYNC: "0 0 18 ? * 6" # at 6:00pm every Saturday
  CRON_LEADERBOARD_RESET: "0 0 6 1 * ?" # at 6:00 on the first day of the month
  CRON_SESSIONS_MORNING_CREATE: "10:00"
  CRON_SESSIONS_MORNING_UPDATE: "11:00"
  CRON_SESSIONS_LUNCH_CREATE: "13:30"
  CRON_SESSIONS_LUNCH_UPDATE: "14:30"
  CRON_SESSIONS_AFTERNOON_CREATE: "15:00"
  CRON_SESSIONS_AFTERNOON_UPDATE: "16:00"
  FRONTEND_URL: "https://scottmakesyoumove.com"
  JWT_AUTH_CONVERTER_RESOURCE_ID: "smym-client"
  KEYCLOAK_AUTH_SERVER_URL: "https://keycloak.scottmakesyoumove.com"
  KEYCLOAK_CLIENT_ADMIN: "admin-cli"
  KEYCLOAK_CLIENT_SMYM: "smym-client"
  KEYCLOAK_REALM_MASTER: "master"
  KEYCLOAK_REALM_SMYM: "smym-prod"
  NOTIFICATION_USER_ID: "4058614e-57f2-4e46-8427-eb103a435a13"
  NOTIFICATION_USER_EMAIL: "scott.everduim@outlook.com"
  NOTIFICATION_USER_NAME: "Scott Everduim"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://smym-db-server.postgres.database.azure.com:5432/smym"
  SPRING_PROFILES_ACTIVE: "cloud,logging"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://keycloak.scottmakesyoumove.com/realms/smym-dev"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "https://keycloak.scottmakesyoumove.com/realms/smym-dev/protocol/openid-connect/certs"

service:
  type: ClusterIP
  port: 8080

resources:
   limits:
     cpu: 1000m
     memory: 1Gi
   requests:
     cpu: 250m
     memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: backend.scottmakesyoumove.com
  tls:
    - secretName: backend-scottmakesyoumove-tls
      hosts:
        - backend.scottmakesyoumove.com
